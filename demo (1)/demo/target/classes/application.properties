# ----------------------
# H2 Database (JPA) - CH? DÙNG JPA
# ----------------------
spring.datasource.url=jdbc:h2:mem:promotiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=root
spring.datasource.password=191204
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------
# T?T R2DBC (Vì b?n ?ang dùng JPA)
# ----------------------
# spring.r2dbc.url=r2dbc:h2:mem:///promotiondb
# spring.r2dbc.username=root
# spring.r2dbc.password=191204

# ----------------------
# T?T FLYWAY (T?m th?i ?? test)
# ----------------------
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# ----------------------
# Server
# ----------------------
server.port=8080

# ----------------------
# Logging
# ----------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.example.demo=DEBUG

# Validation messages
spring.messages.basename=messages/validation